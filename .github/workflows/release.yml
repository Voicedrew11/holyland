# A release (docs/port/LAUNCHER.md, "Making a release"): on a vMAJOR.MINOR.PATCH tag (tools/release.sh), the
# Linux AppImage, the Windows zip and installer, into a DRAFT release; publishing the draft is what players'
# launchers are told about. A preview (tools/prerelease.sh, "Previews") builds the same packages into the rolling,
# password-protected `preview` prerelease instead. Each job also builds the game from the package exactly as a player's launcher
# does (--build-only: the shipped tools, the read-only source, no git), so a release that cannot build is
# never made.
#
# Its caches (the Linux tools, the Windows downloads) are saved only on main: a cache saved by a tag's run is seen by
# that tag alone, and every preview is a new tag, so none was ever used. A push to main that changes what the tools
# are made from runs the two package jobs to fill them (no release, no preview); so does starting it by hand on main.
name: release

on:
  push:
    # preview-<commit>: tools/prerelease.sh's request for a preview, from any branch (a workflow started by
    # hand runs only once this file is on the default branch); the preview job deletes it
    tags: ["v*", "preview-*"]
    branches: [main]
    paths:
      - packaging/toolchain.lock
      - packaging/fetch.sh
      - packaging/linux/toolchain.sh
      - packaging/linux/build-sdl3.sh
      - packaging/windows/toolchain.sh
  workflow_dispatch:
    inputs:
      preview:
        description: 'Publish the build as the rolling "preview" prerelease (tools/prerelease.sh)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  linux:
    # the oldest Linux a release supports: SDL3 is built here (packaging/linux/build-sdl3.sh)
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1 # (appimagetool and the AppImage itself, without FUSE)
    steps:
      # the whole history for tools/version.sh's tags, without old files' contents; the submodules at their commit
      # alone (their history is not needed, and it was most of a minute)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check out the submodules and what paraLLEl-GS needs
        run: |
          git submodule update --init --depth 1
          git -C third_party/parallel-gs submodule update --init Granite
          git -C third_party/parallel-gs/Granite submodule update --init third_party/volk third_party/khronos/vulkan-headers
      - name: Install what SDL3's build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libfuse2 desktop-file-utils libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxtst-dev \
            libxfixes-dev libxi-dev libxss-dev libxinerama-dev libxkbcommon-dev libwayland-dev libegl-dev \
            libdecor-0-dev libpulse-dev libasound2-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev
      - name: The version
        run: |
          case "$GITHUB_REF" in refs/tags/v*) echo "DARKER_REALITY_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV" ;; esac
          bash tools/version.sh
      - name: Restore the tools
        id: tools
        uses: actions/cache/restore@v4
        with:
          path: out/toolchain-linux
          key: toolchain-linux-${{ hashFiles('packaging/toolchain.lock', 'packaging/fetch.sh', 'packaging/linux/toolchain.sh', 'packaging/linux/build-sdl3.sh') }}
      - name: The AppImage
        env:
          DARKER_REALITY_TOOLCHAIN_CACHE: ${{ github.workspace }}/out/toolchain-linux
        run: packaging/linux/build-appimage.sh
      - name: Save the tools
        if: github.ref == 'refs/heads/main' && steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/toolchain-linux
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - name: A player's build from it
        run: |
          app="$(ls dist/*.AppImage)"
          KF4_DATA_DIR="$RUNNER_TEMP/player" "$app" --build-only
          kf4="$(ls "$RUNNER_TEMP"/player/builds/*/kf4)"
          newest="$(objdump -T "$kf4" "$(dirname "$kf4")/libSDL3.so.0" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "the game needs $newest"
          [ "$(printf '%s\nGLIBC_2.35\n' "$newest" | sort -V | tail -1)" = GLIBC_2.35 ]
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # the whole history for tools/version.sh's tags, without old files' contents; the submodules at their commit
      # alone (their history is not needed, and it was most of a minute)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check out the submodules and what paraLLEl-GS needs
        run: |
          git submodule update --init --depth 1
          git -C third_party/parallel-gs submodule update --init Granite
          git -C third_party/parallel-gs/Granite submodule update --init third_party/volk third_party/khronos/vulkan-headers
      - name: The version
        run: |
          case "$GITHUB_REF" in refs/tags/v*) echo "DARKER_REALITY_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV" ;; esac
          bash tools/version.sh
      - name: Inno Setup on PATH
        run: echo "C:/Program Files (x86)/Inno Setup 6" >> "$GITHUB_PATH"
      - name: Restore the downloads
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: out/packaging-cache
          key: packaging-windows-${{ hashFiles('packaging/toolchain.lock') }}
      - name: The zip and the installer
        run: packaging/windows/build-windows.sh
      - name: Save the downloads
        if: github.ref == 'refs/heads/main' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/packaging-cache
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: A player's build from it
        run: |
          stage="dist/win-x64"
          KF4_DATA_DIR="$RUNNER_TEMP/player" "$stage"/darker-reality.exe --build-only
          ls "$RUNNER_TEMP"/player/builds/*/kf4.exe "$RUNNER_TEMP"/player/builds/*/SDL3.dll
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*

  # The preview: one prerelease under the tag `preview`, a build handed to testers, replaced whole on every run, so
  # there is never more than one and its download links never change (as Verdite3's). Each package is zipped with the
  # PREVIEW_PASSWORD secret (AES-256). A prerelease is never GitHub's "latest", so the launcher's update check never
  # announces it, and `preview` is no version (tools/version.sh reads vMAJOR.MINOR.PATCH alone).
  # preview-cleanup.yml deletes it when a release is published.
  preview:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/preview-') || (github.event_name == 'workflow_dispatch' && inputs.preview)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging/package.env
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Zip each package with the password
        run: |
          test -n "$PREVIEW_PASSWORD" || { echo "the PREVIEW_PASSWORD secret is not set"; exit 1; }
          command -v 7z >/dev/null || { sudo apt-get update && sudo apt-get install -y p7zip-full; }
          . packaging/package.env
          sha="${GITHUB_SHA::9}"
          mkdir -p out stage/linux stage/setup stage/win
          cp dist/*.AppImage "stage/linux/$NAME-preview-$sha-x86_64.AppImage"
          chmod +x stage/linux/*.AppImage
          cp dist/*setup.exe "stage/setup/$NAME-preview-$sha-win-x64-setup.exe"
          unzip -q dist/*-win-x64.zip -d stage/win
          # the AppImage and the installer are compressed already: stored, not squeezed again
          (cd stage/linux && 7z a -tzip -mx=0 -mem=AES256 "-p$PREVIEW_PASSWORD" "../../out/$NAME-preview-linux-x86_64.zip" . >/dev/null)
          (cd stage/setup && 7z a -tzip -mx=0 -mem=AES256 "-p$PREVIEW_PASSWORD" "../../out/$NAME-preview-win-x64-setup.zip" . >/dev/null)
          (cd stage/win && 7z a -tzip -mx=5 -mmt=on -mem=AES256 "-p$PREVIEW_PASSWORD" "../../out/$NAME-preview-win-x64.zip" . >/dev/null)
          for f in out/*.zip; do 7z t "-p$PREVIEW_PASSWORD" "$f" >/dev/null; done
          ls -la out
      - name: Replace the preview prerelease
        run: |
          . packaging/package.env
          cat > notes.md <<'NOTES'
          **Preview builds are password protected.** Join the [Verdite Project Discord](https://discord.gg/R4EKCs8RWH) for access.

          **Always back up your saves before installing a preview build!** They are in `%APPDATA%\darker-reality\saves` on Windows and `~/.config/darker-reality/saves` on Linux (quick saves beside them, in `quicksaves`).

          The first start asks for your King's Field IV disc (the USA release, SLUS-20318) and builds the game on your computer, which takes a few minutes and happens once.
          NOTES
          gh release delete preview --cleanup-tag --yes 2>/dev/null || true
          gh release create preview out/*.zip --target "$GITHUB_SHA" --prerelease \
            --title "$DISPLAY_NAME preview (${GITHUB_SHA::9})" --notes-file notes.md
      - name: The request's tag goes
        if: always() && startsWith(github.ref, 'refs/tags/preview-')
        run: gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$GITHUB_REF_NAME" || true
