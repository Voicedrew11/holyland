# Configures the PC port (which proves the patches apply to the pinned decomp), builds it with paraLLEl-GS, and fails if any game code still errors.
# Two jobs: Linux with gcc, and Windows with llvm-mingw (the windows-clang preset) and SDL2, on two pinned
# llvm-mingw releases: the one the port is developed with (clang 22) and a later one, whose io.h once
# clashed with a file-scope `open` in the overlay. The later one runs on main only (a pull request's check is the
# developers' release alone).
#
# It runs on pull requests and on main, not on every branch push and tag as well (a merged change was built four
# times); a newer push to a pull request cancels its older run. The game's builds go through ccache, kept in a cache
# that only main's runs save, so every pull request starts from main's compiled files.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: "1"
  CCACHE_MAXSIZE: 500M

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check out what paraLLEl-GS needs
        run: |
          git -C third_party/parallel-gs submodule update --init Granite
          git -C third_party/parallel-gs/Granite submodule update --init third_party/volk third_party/khronos/vulkan-headers
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc g++ ccache
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-linux-gcc-${{ github.sha }}
          restore-keys: ccache-linux-gcc-
      - name: Configure
        run: cmake --preset linux-gcc -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          ccache -z
          cmake --build out/linux-gcc
          ccache -s
      - name: Save ccache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-linux-gcc-${{ github.sha }}
      - name: VU1 self-test
        run: out/linux-gcc/vu1_test
      - name: Unit tests
        run: ctest --test-dir out/linux-gcc --output-on-failure
      - name: Census must be zero
        run: |
          python3 tools/port_census.py out/linux-gcc > census.txt
          cat census.txt
          grep -q '^0 error(s) in' census.txt

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        llvm_mingw: ${{ fromJSON(github.ref == 'refs/heads/main' && '["20260616", "20261006"]' || '["20260616"]') }}
    env:
      SDL2_VERSION: "2.30.9"
      NINJA_VERSION: "1.12.1"
      CCACHE_VERSION: "4.14.2"
      CCACHE_SHA256: 6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check out what paraLLEl-GS needs
        run: |
          git -C third_party/parallel-gs submodule update --init Granite
          git -C third_party/parallel-gs/Granite submodule update --init third_party/volk third_party/khronos/vulkan-headers
      - name: Download llvm-mingw, SDL2, Ninja and ccache
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          lm="llvm-mingw-${{ matrix.llvm_mingw }}-ucrt-x86_64"
          curl -fsSL -o lm.zip "https://github.com/mstorsjo/llvm-mingw/releases/download/${{ matrix.llvm_mingw }}/$lm.zip"
          unzip -q lm.zip
          curl -fsSL -o sdl.zip "https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-devel-$SDL2_VERSION-mingw.zip"
          unzip -q sdl.zip
          curl -fsSL -o ninja.zip "https://github.com/ninja-build/ninja/releases/download/v$NINJA_VERSION/ninja-win.zip"
          mkdir ninja && unzip -q ninja.zip -d ninja
          cc="ccache-$CCACHE_VERSION-windows-x86_64"
          curl -fsSL -o ccache.zip "https://github.com/ccache/ccache/releases/download/v$CCACHE_VERSION/$cc.zip"
          echo "$CCACHE_SHA256  ccache.zip" | sha256sum -c -
          unzip -q ccache.zip
          tools="$(cygpath -m "$RUNNER_TEMP/tools")"
          echo "$tools/$lm/bin" >> "$GITHUB_PATH"
          echo "$tools/ninja" >> "$GITHUB_PATH"
          echo "$tools/$cc" >> "$GITHUB_PATH"
          echo "SDL2_DIR=$tools/SDL2-$SDL2_VERSION/x86_64-w64-mingw32/lib/cmake/SDL2" >> "$GITHUB_ENV"
      - name: Tool versions
        run: |
          which clang cmake ninja
          clang --version
          cmake --version
          ccache --version | head -1
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-windows-${{ matrix.llvm_mingw }}-${{ github.sha }}
          restore-keys: ccache-windows-${{ matrix.llvm_mingw }}-
      - name: Configure
        run: |
          cmake --preset windows-clang -DSDL2_DIR="$SDL2_DIR" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          ccache -z
          cmake --build out/windows-clang
          ccache -s
      - name: Save ccache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-windows-${{ matrix.llvm_mingw }}-${{ github.sha }}
      - name: VU1 self-test
        run: out/windows-clang/vu1_test.exe
      - name: Unit tests
        run: ctest --test-dir out/windows-clang --output-on-failure
      - name: Census must be zero
        run: |
          python tools/port_census.py out/windows-clang > census.txt
          cat census.txt
          grep -q '^0 error(s) in' census.txt

  # The launcher (launcher/, docs/port/LAUNCHER.md): its tests, and Granite's edits making no change to a
  # read-only checkout that has them (a release's source on the player's computer)
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check out what paraLLEl-GS needs
        run: |
          git -C third_party/parallel-gs submodule update --init Granite
          git -C third_party/parallel-gs/Granite submodule update --init third_party/volk third_party/khronos/vulkan-headers
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libsdl2-dev
      - name: Build and test
        run: |
          cd launcher
          cmake --preset linux
          cmake --build --preset linux
          ctest --test-dir ../out/launcher-linux --output-on-failure
      - name: Granite's edits on a read-only copy
        run: |
          cmake -DGRANITE=third_party/parallel-gs/Granite -P cmake/apply_granite_edits.cmake
          cp -r third_party/parallel-gs/Granite "$RUNNER_TEMP/granite"
          chmod -R a-w "$RUNNER_TEMP/granite"
          cmake -DGRANITE="$RUNNER_TEMP/granite" -P cmake/apply_granite_edits.cmake
