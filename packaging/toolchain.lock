# The tools a release ships for building the game on the player's computer (docs/port/LAUNCHER.md,
# "The tools"), pinned: name, SHA-256, URL. packaging/fetch.sh downloads each once into the cache and
# refuses one whose SHA-256 differs. To move a tool: change its line, run `packaging/fetch.sh --print NAME`
# for the new SHA-256, and bump the platform's ID in packaging/<platform>/toolchain.sh (a new ID makes
# every player's next start build again).
